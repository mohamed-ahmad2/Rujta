name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ closed ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'Backend/Rujta/Rujta.sln'
  API_PROJECT_PATH: 'Backend/Rujta/Rujta.Api/Rujta.API.csproj'
  PUBLISH_DIR: ${{ github.workspace }}\publish

jobs:
  build-and-deploy:
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-build /p:UseAppHost=false

      - name: Save Publish Profile
        run: |
          $profile = @'
          ${{ secrets.PUBLISH_PROFILE }}
          '@
          $profile | Out-File -FilePath "${{ github.workspace }}\publish-profile.pubxml" -Encoding utf8
        shell: pwsh

      - name: Deploy with MSDeploy
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          & $msdeploy `
            -verb:sync `
            -source:contentPath="${{ env.PUBLISH_DIR }}" `
            -dest:contentPath="${{ secrets.MONSTER_SITE_NAME }}",ComputerName="https://${{ secrets.MONSTER_SERVER }}:8172/msdeploy.axd?site=${{ secrets.MONSTER_SITE_NAME }}",UserName="${{ secrets.MONSTER_USERNAME }}",Password="${{ secrets.MONSTER_PASSWORD }}",AuthType="Basic" `
            -allowUntrusted:true `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule
        shell: pwsh